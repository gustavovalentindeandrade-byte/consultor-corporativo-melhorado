<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Corporativa | SCI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --corporate-blue: #002776; 
            --corporate-blue-medium: #003876;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; color: #334155; }
        .navbar { background-color: var(--corporate-blue) !important; }
        .card { border: none; border-radius: 12px; }
        .badge-industrial-yes { background-color: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .badge-industrial-no { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        @media print { .print-hide { display: none !important; } .card { box-shadow: none !important; border: 1px solid #ddd !important; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm print-hide mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fa-solid fa-building-shield fs-3 me-2 text-info"></i>
                <div>
                    <span class="fw-bold d-block lh-1">Inteligência Corporativa</span>
                    <small class="fw-light opacity-75" style="font-size: 0.7rem;">SISTEMA DE CLASSIFICAÇÃO INDUSTRIAL</small>
                </div>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 print-hide">
            <div class="col-lg-8 mx-auto">
                <div class="bg-white p-2 rounded-3 shadow-sm d-flex gap-2">
                    <button type="button" class="btn btn-primary flex-fill py-2 fw-semibold" id="tabIndividual">Individual</button>
                    <button type="button" class="btn btn-outline-secondary flex-fill py-2 fw-semibold border-0" id="tabLote">Em Lote</button>
                </div>
            </div>
        </div>

        <!-- Individual -->
        <div id="individualSection" class="fade-in">
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="input-group input-group-lg mb-3">
                        <input type="text" id="cnpjInput" class="form-control" placeholder="Digite o CNPJ..." maxlength="18">
                        <button class="btn btn-primary px-5 fw-bold" id="btnConsultar">Consultar</button>
                    </div>
                </div>
            </div>
            <div id="resultContainer" class="d-none">
                <!-- Resultados renderizados via JS -->
                <div id="fichaEmpresa"></div>
            </div>
        </div>

        <!-- Lote -->
        <div id="batchSection" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <h5>Processamento em Massa</h5>
                    <textarea id="batchInput" class="form-control mb-3" rows="8" placeholder="Cole os CNPJs aqui..."></textarea>
                    <button class="btn btn-primary w-100 fw-bold" id="btnProcessarLote">Iniciar Processamento</button>
                    <button class="btn btn-success w-100 fw-bold mt-2 d-none" id="btnExportarLoteExcel">Exportar Excel</button>
                    <div id="batchProgress" class="mt-2 text-primary fw-bold"></div>
                </div>
            </div>
            <div id="batchResultContainer" class="card shadow-sm d-none">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead><tr><th>CNPJ</th><th>Razão Social</th><th>Indústria?</th></tr></thead>
                        <tbody id="batchTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cnaesIndustria = ["0500-3/01", "0600-0/01"]; // (Sua lista completa aqui)
            const industriaSet = new Set(cnaesIndustria.map(v => v.replace(/\D/g, '')));

            // DOM Elements
            const tabIndividual = document.getElementById('tabIndividual');
            const tabLote = document.getElementById('tabLote');
            const individualSection = document.getElementById('individualSection');
            const batchSection = document.getElementById('batchSection');
            const btnProcessarLote = document.getElementById('btnProcessarLote');
            const batchInput = document.getElementById('batchInput');
            const batchTableBody = document.getElementById('batchTableBody');
            const batchProgress = document.getElementById('batchProgress');

            // Toggle Tabs
            tabIndividual.onclick = () => { individualSection.classList.remove('d-none'); batchSection.classList.add('d-none'); };
            tabLote.onclick = () => { batchSection.classList.remove('d-none'); individualSection.classList.add('d-none'); };

            // AÇÃO DO BOTÃO LOTE
            btnProcessarLote.addEventListener('click', async () => {
                console.log("Botão de lote clicado!"); // Debug
                const input = batchInput.value;
                const cnpjs = input.split(/[\n,]+/).map(c => c.replace(/\D/g, '')).filter(c => c.length === 14);

                if (cnpjs.length === 0) return alert("Nenhum CNPJ válido encontrado.");

                batchTableBody.innerHTML = '';
                btnProcessarLote.disabled = true;
                document.getElementById('batchResultContainer').classList.remove('d-none');

                for (let i = 0; i < cnpjs.length; i++) {
                    batchProgress.innerText = `Consultando ${i + 1} de ${cnpjs.length}...`;
                    try {
                        const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjs[i]}`);
                        if (!response.ok) throw new Error("Erro");
                        const data = await response.json();
                        
                        // Verificar indústria
                        const allCnaes = [data.cnae_fiscal, ...(data.cnaes_secundarios || []).map(s => s.codigo)];
                        const isInd = allCnaes.some(c => industriaSet.has(c.toString().replace(/\D/g, '')));

                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${data.cnpj}</td><td>${data.razao_social}</td><td>${isInd ? 'SIM' : 'NÃO'}</td>`;
                        batchTableBody.appendChild(tr);
                    } catch (e) {
                        console.error(e);
                    }
                    await new Promise(r => setTimeout(r, 1000));
                }
                btnProcessarLote.disabled = false;
                batchProgress.innerText = "Concluído!";
            });
        });
    </script>
</body>
</html>
